<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Access</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #000;
        color: #00ff41;
        font-family: "Courier New", monospace;
        min-height: 100vh;
        overflow: hidden;
    }

    #terminal {
        padding: 25px;
        font-size: 15px;
        line-height: 1.7;
        text-shadow: 0 0 5px #00ff41;
    }

    .line {
        margin-bottom: 4px;
    }

    .warning {
        color: #ff3333;
        text-shadow: 0 0 8px red;
    }

    .yellow {
        color: #ffff00;
    }

    .center {
        text-align: center;
        margin-top: 35vh;
    }

    .big {
        font-size: 28px;
        font-weight: bold;
    }

    .progress-container {
        width: 90%;
        max-width: 500px;
        height: 22px;
        border: 1px solid #00ff41;
        margin: 20px auto;
    }

    #progress {
        width: 0%;
        height: 100%;
        background: #00ff41;
        box-shadow: 0 0 15px #00ff41;
    }

    #final {
        display: none;
        padding: 25px;
        text-align: center;
    }

    #final h1 {
        color: #ff1744;
        text-shadow: 0 0 15px red;
        font-size: 32px;
    }

    #final p {
        color: white;
        font-family: Arial, sans-serif;
        font-size: 20px;
    }

    button {
        margin-top: 25px;
        padding: 14px 25px;
        background: transparent;
        color: #ff1744;
        border: 2px solid #ff1744;
        font-family: "Courier New", monospace;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #ff1744;
        color: white;
    }

    .blink {
        animation: blink 0.7s infinite;
    }

    @keyframes blink {
        50% { opacity: 0; }
    }
</style>
</head>

<body>

<div id="terminal"></div>

<div id="final">

    <h1>⚠ ACCESO CONCEDIDO ⚠</h1>

    <p>
        JAJAJAJAJA 🤭
    </p>

    <p>
        ¿De verdad pensaste que podía entrar a tu teléfono? 😂
    </p>

    <p>
        <b>TE LA CREÍSTE MI AMOR ❤️</b>
    </p>

    <p>
        No puedo hackear tu teléfono...
        pero sí puedo hacerte pasar un sustito 😈
    </p>

    <button onclick="location.reload()">
        VOLVER A ASUSTARME
    </button>

</div>

<script>

const terminal = document.getElementById("terminal");

const mensajes = [
    "Initializing remote connection...",
    "Establishing secure channel...",
    "Connection detected.",
    "Device identified.",
    "Scanning system...",
    "Analyzing operating system...",
    "Checking permissions...",
    "Searching active applications...",
    "WhatsApp ............... FOUND",
    "Galería ................ FOUND",
    "Contactos .............. FOUND",
    "Mensajes ............... FOUND",
    "Archivos ............... FOUND",
    "Location services ...... ACTIVE",
    "Security level ......... LOW",
    "",
    "WARNING: Unauthorized access detected.",
    "Bypassing security...",
    "Accessing private directories...",
    "Downloading personal data...",
    "████████████████████████",
    "",
    "ACCESS GRANTED."
];

let i = 0;

function escribir() {

    if (i < mensajes.length) {

        const div = document.createElement("div");
        div.className = "line";

        if (
            mensajes[i].includes("WARNING") ||
            mensajes[i].includes("ACCESS GRANTED")
        ) {
            div.classList.add("warning");
        }

        div.textContent = "> " + mensajes[i];

        terminal.appendChild(div);

        window.scrollTo(0, document.body.scrollHeight);

        i++;

        setTimeout(escribir, 450);

    } else {

        iniciarCarga();

    }
}

function iniciarCarga() {

    terminal.innerHTML += `
        <div class="center">
            <div class="big warning blink">
                ⚠ ACCESSING DEVICE ⚠
            </div>

            <div class="progress-container">
                <div id="progress"></div>
            </div>

            <div id="percent">0%</div>
        </div>
    `;

    let progreso = 0;

    const intervalo = setInterval(() => {

        progreso += Math.floor(Math.random() * 8) + 3;

        if (progreso >= 100) {

            progreso = 100;
            clearInterval(intervalo);

            setTimeout(() => {

                document.getElementById("terminal").style.display = "none";
                document.getElementById("final").style.display = "block";

            }, 1200);
        }

        document.getElementById("progress").style.width =
            progreso + "%";

        document.getElementById("percent").textContent =
            progreso + "%";

    }, 350);
}

escribir();

</script>

</body>
  </html>
